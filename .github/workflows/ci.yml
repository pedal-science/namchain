name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  linux-x86_64:
    name: linux-x86_64 (build + unit tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DNAMCHAIN_WERROR=ON
      - name: Build
        run: cmake --build build -j"$(nproc)"
      - name: Test
        # soak_cli is excluded from CI everywhere, not just the Pi job: it is the one
        # ctest entry that asserts on the harness's own scheduling (SCHED_FIFO,
        # affinity, an mlockall path under a memlock limit), and no CI machine --
        # hosted VM or container -- is where RT behaviour should be judged. Run it on
        # a normal build; the host-only instruments in tools/soak/ were never in
        # ctest to begin with.
        run: ctest --test-dir build --output-on-failure -E soak_cli
      - name: Golden comparison numbers
        # Recorded verbosely because ctest hides the output of a passing test. The measured
        # max|diff| is what tells us whether NAMCHAIN_GOLDEN_TOLERANCE is still meaningful:
        # on AArch64 (planar kernels) it is 0, and this is the only place the x86_64 value
        # (Eigen path) is visible.
        run: ctest --test-dir build -R golden_a2_lite -V

  # RealtimeSanitizer flags allocations/locks/syscalls on the render path (plan.md §10.4).
  # It requires clang >= 20: Ubuntu 24.04's default clang 18 rejects -fsanitize=realtime
  # with "unsupported argument 'realtime' to option '-fsanitize='".
  rtsan:
    name: linux-x86_64 (RealtimeSanitizer, clang-20)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang-20
      - name: Verify the toolchain actually supports RTSan
        run: |
          printf 'int main(){return 0;}\n' > /tmp/rtsan-probe.cpp
          clang++-20 -fsanitize=realtime /tmp/rtsan-probe.cpp -o /tmp/rtsan-probe
      - name: Configure
        run: >
          cmake -S . -B build-rtsan -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_C_COMPILER=clang-20
          -DCMAKE_CXX_COMPILER=clang++-20
          -DNAMCHAIN_RTSAN=ON
      - name: Build
        run: cmake --build build-rtsan -j"$(nproc)"
      - name: Test
        run: ctest --test-dir build-rtsan --output-on-failure

  # This job is load-bearing, not just a smoke test: it is the only CI job where the A2 planar
  # NEON kernels are compiled in (they are AArch64/ARMv7-only), so it is where the bit-identity
  # parity gate against the reference A2FastModel actually executes. qemu emulates NEON, so the
  # memcmp parity checks are meaningful here even though the timings are not.
  # ThreadSanitizer for the RT primitives (plan.md §10.1). The SPSC ring and the reclaimer are the
  # only concurrent code in the engine, and a race in them corrupts audio in ways nothing else
  # catches. TSan is far too slow for the render path, so it is a correctness instrument only --
  # which is also why the allocation interposer is auto-disabled here: a sanitizer runtime
  # intercepts operator new and would bypass it.
  tsan:
    name: linux-x86_64 (ThreadSanitizer -- RT primitives)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang-20
      - name: Configure
        run: >
          cmake -S . -B build-tsan -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_C_COMPILER=clang-20
          -DCMAKE_CXX_COMPILER=clang++-20
          -DNAMCHAIN_TSAN=ON
      - name: Build
        run: cmake --build build-tsan -j"$(nproc)"
      - name: Test
        run: ctest --test-dir build-tsan -R unit --output-on-failure

  aarch64-cross:
    name: aarch64 cross + qemu (incl. A2 planar parity gate)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++-aarch64-linux-gnu qemu-user-static
      - name: Configure
        run: >
          cmake -S . -B build-aarch64 -G Ninja
          -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/aarch64-linux-gnu.cmake
          -DCMAKE_BUILD_TYPE=Release
          -DNAMCHAIN_REQUIRE_A2_PARITY=ON
      - name: Build
        run: cmake --build build-aarch64 -j"$(nproc)"
      - name: Test under qemu
        run: qemu-aarch64-static -L /usr/aarch64-linux-gnu ./build-aarch64/namchain-tests
      - name: A2 planar parity gate must have actually run
        # NAMCHAIN_REQUIRE_A2_PARITY turns a self-skip into a failure, so this cannot pass
        # vacuously if the build type or arch gating changes underneath us.
        run: |
          qemu-aarch64-static -L /usr/aarch64-linux-gnu ./build-aarch64/namchain-tests \
            --test-case="planar*"

  armv7-cross:
    name: armv7 cross (build only)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++-arm-linux-gnueabihf
      - name: Configure
        run: >
          cmake -S . -B build-armv7 -G Ninja
          -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/armv7-linux-gnueabihf.cmake
          -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build-armv7 -j"$(nproc)"

  # Bare-metal Raspberry Pi 5 (BCM2712, quad Cortex-A76), native aarch64 — no
  # cross-compiler and no qemu anywhere in the job. This is the machine plan.md §1
  # and §10.5 measure on, and the only CI job where the A2 planar NEON kernels run
  # on the real core rather than under an emulator's model of one.
  #
  # It runs on the self-hosted runner registered by machina for this host
  # (capability `github-actions-runner`; labels self-hosted,Linux,ARM64,machina,pi).
  # cmake, ninja, g++-13 and clang-18 are baked into that image, so there is no
  # toolchain install step to pay for on every push.
  #
  # This job is a correctness gate. The authoritative performance and soak numbers
  # are not CI's to produce — they come from the RT arms in plan-rt-piv.md, which
  # need the real audio device, the RT kernel and core isolation, none of which a
  # shared CI container has (see the note at the end of this file).
  pi-native:
    name: Raspberry Pi 5 (native aarch64, bare metal)
    runs-on: [self-hosted, machina]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Clean the reused workspace
        # A self-hosted runner keeps _work between jobs. actions/checkout resets
        # tracked files in this repository but leaves untracked files inside the
        # submodules, so on the second run NAMCHAIN_APPLY_VENDOR_PATCHES fails with
        # "NAM/wavenet/a2_planar.cpp: already exists in working directory". Reset
        # and clean every submodule (the patch touches tracked files too).
        run: git submodule foreach --recursive 'git reset --hard -q && git clean -ffdxq'

      - name: Toolchain
        run: |
          cmake --version | head -1
          ninja --version
          g++ --version | head -1
          echo "cores: $(nproc)"
      - name: Configure
        run: >
          cmake -S . -B build-pi -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DNAMCHAIN_WERROR=ON
          -DNAMCHAIN_REQUIRE_A2_PARITY=ON
      - name: Build
        # -j2, not -j"$(nproc)": this runner shares an 8 GB Pi with the other
        # repository's jobs and the host has no swap (deliberately -- it is an RT
        # audio machine). Two four-way C++ builds at once have already OOM-killed
        # cc1plus here. Two jobs' worth of parallelism fits; four do not.
        run: cmake --build build-pi -j2
      - name: Test
        # soak_cli is excluded on purpose. It is the one ctest entry that asserts on
        # the harness's own scheduling: it sets SCHED_FIFO and affinity and takes an
        # mlockall path under a memlock limit. Unprivileged it reports those as
        # caveats rather than failing, but that is RT behaviour and this runner is a
        # container -- no CAP_SYS_NICE, no isolation, no device. It is exercised on a
        # normal build, not here.
        #
        # The instruments that really need the host (tools/soak/piv-isolation-ab.sh,
        # rt-manipulation-check.sh, heartbeat-run.sh, the hour-long arms) are not
        # wired into ctest at all and never run in CI.
        run: ctest --test-dir build-pi --output-on-failure -E soak_cli
      - name: Golden comparison numbers
        # On AArch64 (planar kernels) the measured max|diff| is 0. Recorded
        # verbosely here so the Pi's number sits next to the x86_64 (Eigen path)
        # one printed by linux-x86_64.
        run: ctest --test-dir build-pi -R golden_a2_lite -V

  # NOTE: the authoritative performance/soak numbers come from bare-metal RT runs on
  # this same Raspberry Pi (plan-rt-piv.md), not from a shared cloud runner and not
  # from the containerised `pi-native` job above: they need the audio device, the RT
  # kernel parameters and the core isolation. Numbers measured under a cloud VM's
  # noisy-neighbour CPU would be meaningless; numbers measured without the device
  # would be a different measurement, not a worse one.
